name: Embed pages (수동 실행)

# 홈페이지 안내 문서(data/pages)를 청킹·임베딩해서 DB에 적재 (작업 1-4a).
# Actions 탭 → "Embed pages" → Run workflow → 동작 선택.
#   check:  청킹 결과만 확인 (DB·Gemini 안 씀)
#   apply:  임베딩해서 DB에 적재 (본문이 안 바뀐 문서는 건너뜀 — 여러 번 눌러도 안전)
#   search: 아래 '검색어'로 적재된 문서를 검색해 결과 확인
# 전제: backend의 doc_type '안내' 마이그레이션(0005)이 배포되어 있어야 apply가 성공함.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "동작 (check = 청킹 확인만, apply = DB 적재, search = 검색 확인)"
        type: choice
        options: [check, apply, search]
        default: check
      remove_missing:
        description: "apply일 때: 이번 목록에 없는 안내 문서를 DB에서 삭제"
        type: boolean
        default: false
      query:
        description: "search일 때 검색어 (예: 휴학 신청 기간)"
        type: string
        default: ""

jobs:
  embed:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      ACTION: ${{ inputs.action }}
      REMOVE_MISSING: ${{ inputs.remove_missing }}
      QUERY: ${{ inputs.query }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "$ACTION" = "check" ]; then
            python scripts/embed_pages.py | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$ACTION" = "apply" ]; then
            if [ "$REMOVE_MISSING" = "true" ]; then
              python scripts/embed_pages.py --apply --remove-missing | tee -a "$GITHUB_STEP_SUMMARY"
            else
              python scripts/embed_pages.py --apply | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          else
            python scripts/embed_pages.py --search "$QUERY" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
