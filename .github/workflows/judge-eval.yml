name: Judge eval (수동 실행)

# 신고 판정(카테고리·영향도·긴급도→우선순위) 정확도를 실제 Gemini로 측정하고 규칙 기반 비교군과 비교 (명세서 10-1, 10-4 S-7).
# Actions 탭 → "Judge eval" → Run workflow → 세트 선택.
#   holdout: 평가 세트 — 결과보고서·영상용 수치. 이 결과를 보고 프롬프트를 고치지 않음
#   dev:     개발 세트 — 프롬프트를 고친 뒤 회귀 확인용
# 배포와는 무관. 결과는 실행 화면 Summary + 아티팩트(judge-eval-result)에 남음.
on:
  workflow_dispatch:
    inputs:
      set:
        description: "평가할 세트 (holdout = 보고서용, dev = 프롬프트 수정 후 회귀 확인)"
        type: choice
        options: [holdout, dev]
        default: holdout

jobs:
  eval:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Run eval
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/eval_judge.py --set ${{ inputs.set }} --out judge-eval-result.md

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: judge-eval-result-${{ inputs.set }}
          path: judge-eval-result.md
          if-no-files-found: ignore
