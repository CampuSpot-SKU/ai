[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai"
version = "0.1.0"
description = "캠퍼스팟 AI 로직 패키지 (의도분류/RAG/우선순위/탐지/예측) — backend가 설치해서 사용"
requires-python = ">=3.11"
dependencies = [
    "google-genai",  # Gemini API (Google AI Studio) 클라이언트 — pgvector 등 나머지는 확정되는 대로 추가
]

[tool.setuptools.packages.find]
include = ["ai*"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
