[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai"
version = "0.1.0"
description = "캠퍼스팟 AI 로직 패키지 — campuspot-ai 서비스(app/)가 이 패키지를 사용, backend는 HTTP로 호출"
requires-python = ">=3.11"
# 의존성은 여기 한 곳에서만 관리 (Dockerfile·CI 모두 이 목록으로 설치).
# 버전 고정 — 새 버전 출시로 배포가 갑자기 깨지는 것 방지. 올릴 때는 의도적으로 숫자를 바꿀 것.
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.1.1",        # ai/db.py — 탐지/예측/공지크롤링의 DB 접근
    "psycopg2-binary==2.9.13",
    "google-genai==2.25.0",     # Gemini API (Google AI Studio)
    "python-dotenv==1.2.3",
]

[tool.setuptools.packages.find]
include = ["ai*"]

# 프롬프트(.md)도 패키지에 포함 — Docker에서 pip install . 할 때 빠지지 않도록
[tool.setuptools.package-data]
ai = ["prompts/*.md"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"

# scripts/의 평가 로직(S-7a)을 테스트에서 import할 수 있도록
[tool.pytest.ini_options]
pythonpath = ["scripts"]
